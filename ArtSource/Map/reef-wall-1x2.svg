<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="160" height="288" viewBox="0 0 160 288">
  <title>Reef over the two wall cells of map 01. One cell is 128 px; the body covers the 0.95 cell squares drawn by BoardView</title>
  <defs>
