<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="120" height="32" viewBox="0 0 120 32">
  <title>Match HUD confirm button, hover</title>
  <sodipodi:namedview id="view" pagecolor="#0c1626" inkscape:pageopacity="0" inkscape:document-units="px"/>
  <defs>
    <linearGradient id="p-body" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0" stop-color="#2e78ca"/>
      <stop offset="1" stop-color="#2263b0"/>
    </linearGradient>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="plate" id="layer-plate">
    <rect id="p-plate" x="1.0" y="1.0" width="118" height="30" rx="7" fill="url(#p-body)" stroke="#070d18" stroke-width="2"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="rim" id="layer-rim">
    <rect id="p-rim" x="3.5" y="3.5" width="113.0" height="25.0" rx="4.5" fill="none" stroke="#cfe6ff" stroke-width="1" opacity="0.95"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="light" id="layer-light">
    <rect id="p-sheen" x="5" y="4" width="110" height="3" rx="1.5" fill="#ffffff" opacity="0.14"/>
    <rect id="p-keel" x="5" y="25" width="110" height="3" rx="1.5" fill="#070d18" opacity="0.18"/>
    <rect id="p-waterline" x="5" y="26" width="110" height="2" rx="1.0" fill="#ffb347" opacity="1"/>
  </g>
</svg>
